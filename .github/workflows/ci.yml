name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, typecheck, unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The PDF export tests read the exported files with poppler (pdfinfo, pdftoppm).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # TEMPORARY: where the sticker test stalls on the runner (every Playwright call, timed).
      - run: npm run stickers -w @travelbook/desktop && npx electron-vite build --mode e2e && xvfb-run --auto-servernum npx playwright test e2e/stickers.spec.ts:27
        working-directory: apps/desktop
        continue-on-error: true
        env:
          DEBUG: pw:api
      - run: xvfb-run --auto-servernum npm run e2e
      # What a failed test saw (its error context and page snapshot), to read without a rerun.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/desktop/test-results/
          retention-days: 7
