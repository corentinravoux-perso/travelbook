<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>travelbook</title>
  <!-- A double A4 spread (two pages of 352 x 498 before the 1.1 scale: the proportions 210 x 297) on the app's ink.
       One photograph runs across the gutter and a route crosses it. Neutral greys only, the
       values of docs/design/visual-direction.md. -->
  <defs>
    <clipPath id="photo"><rect x="184" y="295" width="656" height="320" rx="6"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="112" fill="#1f1f1f"/>
  <g transform="translate(512 512) scale(1.1) translate(-512 -512)">
  <rect x="152" y="263" width="352" height="498" fill="#f7f7f7"/>
  <rect x="520" y="263" width="352" height="498" fill="#f7f7f7"/>
  <g clip-path="url(#photo)">
    <rect x="184" y="295" width="656" height="320" fill="#cfcfcf"/>
    <path d="M184 470 C 280 400, 380 410, 470 460 S 640 520, 740 440 S 820 400, 840 410 V615 H184Z" fill="#8a8a8a"/>
    <path d="M184 560 C 300 480, 400 500, 500 545 S 680 590, 760 520 S 830 490, 840 495 V615 H184Z" fill="#474747"/>
    <path d="M206 596 C 300 530, 380 500, 468 528 S 590 560, 650 490 S 740 420, 790 368"
          fill="none" stroke="#f7f7f7" stroke-width="13" stroke-linecap="round" stroke-dasharray="1 30"/>
    <circle cx="790" cy="368" r="22" fill="none" stroke="#f7f7f7" stroke-width="11"/>
  </g>
  <rect x="504" y="263" width="16" height="498" fill="#1f1f1f"/>
  <rect x="184" y="652" width="112" height="16" rx="2" fill="#8a8a8a"/>
  <rect x="552" y="652" width="256" height="16" rx="2" fill="#8a8a8a"/>
  <rect x="552" y="690" width="168" height="16" rx="2" fill="#8a8a8a"/>
  </g>
</svg>
