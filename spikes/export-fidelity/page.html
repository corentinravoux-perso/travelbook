<!doctype html>
<html><head><meta charset="utf-8">
<style>
@page { size: 216mm 303mm; margin: 0 }
@font-face { font-family: PF; src: url(fonts/playfair-display-latin-700-normal.woff2) format('woff2'); font-weight: 700 }
@font-face { font-family: CV; src: url(fonts/caveat-latin-700-normal.woff2) format('woff2'); font-weight: 700 }
* { box-sizing: border-box }
html, body { margin: 0; padding: 0 }
.page { position: relative; width: 216mm; height: 303mm; overflow: hidden;
  background: linear-gradient(160deg, #f6e7c8 0%, #c9dff0 55%, #e8c7d8 100%) }
.abs { position: absolute }
#frame { left: 12mm; top: 14mm; width: 192mm; height: 128mm; border-radius: 6mm; overflow: hidden;
  box-shadow: 3mm 3mm 6mm rgba(0,0,0,.45) }
#frame img, #ellipse img, #opacity img { width: 100%; height: 100%; object-fit: cover; display: block }
#ellipse { left: 20mm; top: 152mm; width: 80mm; height: 80mm; clip-path: ellipse(50% 42% at 50% 50%) }
#ellipse img { filter: saturate(1.3) contrast(1.1) }
#opacity { left: 112mm; top: 158mm; width: 80mm; height: 60mm; opacity: .8; transform: rotate(7deg) }
#svg { left: 150mm; top: 118mm; width: 40mm; height: 40mm; transform: rotate(-12deg) }
#png { left: 16mm; top: 228mm; width: 40mm; height: 40mm; transform: rotate(20deg) }
#t1 { left: 62mm; top: 238mm; width: 140mm; font: 700 11mm/1.15 PF, serif; color: #2a2a2a;
  text-shadow: 0.6mm 0.6mm 1mm rgba(0,0,0,.5) }
#t2 { left: 62mm; top: 268mm; width: 140mm; font: 700 8mm/1.2 CV, cursive; color: #5a2a6a }
/* variants: each shows a single photo with a single effect */
body[data-v] .page > :not(.keep) { display: none }
body[data-v=plain] #frame { box-shadow: none; border-radius: 0 }
body[data-v=plain] #ellipse, body[data-v=plain] #opacity { display: none }
body[data-v=shadow] #frame { border-radius: 0 }
body[data-v=rounded] #frame { box-shadow: none }
</style></head>
<body>
<div class="page">
  <div id="frame" class="abs"><img src="out/in/photo-frame.jpg"></div>
  <div id="ellipse" class="abs"><img src="out/in/photo-ellipse.jpg"></div>
  <div id="opacity" class="abs"><img src="out/in/photo-opacity.jpg"></div>
  <img id="svg" class="abs" src="out/in/sticker.svg">
  <img id="png" class="abs" src="out/in/sticker.png">
  <div id="t1" class="abs">Sunset over the bay</div>
  <div id="t2" class="abs">Une journée inoubliable, été 2026</div>
</div>
<script>
const v = location.hash.slice(1)
if (v) {
  document.body.dataset.v = v
  const show = { plain: ['frame'], shadow: ['frame'], rounded: ['frame'],
    clip: ['ellipse'], filter: ['ellipse'], opacity: ['opacity'], rotate: ['opacity'], textshadow: ['t1'], svg: ['svg'], png: ['png'] }[v]
  for (const id of show) document.getElementById(id).classList.add('keep')
  const s = document.createElement('style')
  if (v === 'clip') s.textContent = '#ellipse img{filter:none}'
  if (v === 'filter') s.textContent = '#ellipse{clip-path:none}'
  if (v === 'opacity') s.textContent = '#opacity{transform:none}'
  if (v === 'rotate') s.textContent = '#opacity{opacity:1}'
  document.head.appendChild(s)
}
</script>
</body></html>
